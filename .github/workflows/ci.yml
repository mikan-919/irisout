name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - run: bun run build
      - run: bun run site:check
      - run: bun run site:test
      - run: bun run build:web
      - run: bun run test:web:server
      - run: bun run test:web:save
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Resolve Nix Chromium
        run: |
          chromium_path="$(nix build --no-link --print-out-paths nixpkgs#chromium)/bin/chromium"
          test -x "$chromium_path"
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$chromium_path" >> "$GITHUB_ENV"
      - run: bun run test:web:playground
      - run: bun run pack:smoke
